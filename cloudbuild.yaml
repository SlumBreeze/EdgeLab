steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/edgelab2',
      '--build-arg', 'VITE_SUPABASE_URL=$_SUPABASE_URL',
      '--build-arg', 'VITE_SUPABASE_PUBLISHABLE_KEY=$_SUPABASE_PUBLISHABLE_KEY',
      '--build-arg', 'VITE_AUTH_REQUIRED=true',
      '.'
    ]
images:
  - 'gcr.io/$PROJECT_ID/edgelab2'
